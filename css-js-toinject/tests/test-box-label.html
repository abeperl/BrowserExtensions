<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Box Label Silent Print - Test Loader</title>
</head>
<body>
    <h1>Box Label Silent Print - Test Loader</h1>
    <p>This file loads ONLY the new box-label-only-silent.js for testing.</p>

    <div id="status">
        <h2>Loading Status:</h2>
        <ul id="status-list"></ul>
    </div>

    <div id="manual-test" style="margin-top: 20px; padding: 20px; border: 2px solid #ccc;">
        <h2>Manual Test</h2>
        <p>Enter a shipment ID to test printing:</p>
        <input type="number" id="shipment-id-input" placeholder="Enter shipment ID" style="padding: 10px; font-size: 16px; width: 200px;">
        <button onclick="testPrint()" style="padding: 10px 20px; font-size: 16px; margin-left: 10px;">Test Print</button>

        <div style="margin-top: 20px;">
            <button onclick="checkJSPM()" style="padding: 10px 20px; font-size: 16px;">Check JSPrintManager</button>
            <button onclick="listPrinters()" style="padding: 10px 20px; font-size: 16px; margin-left: 10px;">List Printers</button>
        </div>
    </div>

    <!-- Load JSPrintManager first -->
    <script src="JSPrintManager.js"></script>

    <!-- Load dependencies (if needed) -->
    <!-- Note: Box label script depends on tf.service, common, JsBarcode, etc. from the main site -->

    <!-- Load OverlayManager for notifications -->
    <script src="overlay-manager.js"></script>

    <!-- Load the new box-label-only-silent.js -->
    <script src="box-label-only-silent.js"></script>

    <!-- Load router (updated to use box-label-only-silent.js) -->
    <script src="router.js"></script>

    <script>
        // Status logger
        function logStatus(message, type = 'info') {
            const list = document.getElementById('status-list');
            const li = document.createElement('li');
            li.textContent = message;
            li.style.color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'blue';
            list.appendChild(li);
            console.log(message);
        }

        // Check what's loaded
        window.addEventListener('load', () => {
            logStatus('Page loaded');

            // Check JSPrintManager
            if (typeof JSPM !== 'undefined') {
                logStatus('✅ JSPrintManager loaded', 'success');
            } else {
                logStatus('❌ JSPrintManager NOT loaded', 'error');
            }

            // Check OverlayManager
            if (typeof OverlayManager !== 'undefined') {
                logStatus('✅ OverlayManager loaded', 'success');
            } else {
                logStatus('⚠️ OverlayManager NOT loaded (optional)', 'error');
            }

            // Check box-label-only-silent.js
            if (typeof window.boxLabelSilent !== 'undefined') {
                logStatus('✅ box-label-only-silent.js loaded', 'success');
                logStatus('   Printer: ' + window.boxLabelSilent.config.printerName);
                logStatus('   Auto-trigger: ' + window.boxLabelSilent.config.autoTriggerEnabled);
            } else {
                logStatus('❌ box-label-only-silent.js NOT loaded', 'error');
            }

            // Check router
            if (typeof window.extensionRouter !== 'undefined') {
                logStatus('✅ Router loaded', 'success');
            } else {
                logStatus('⚠️ Router NOT loaded (optional)');
            }
        });

        // Test functions
        function testPrint() {
            const shipmentId = document.getElementById('shipment-id-input').value;
            if (!shipmentId) {
                alert('Please enter a shipment ID');
                return;
            }

            logStatus(`Testing print for shipment ID: ${shipmentId}`);

            if (typeof window.boxLabelSilent !== 'undefined') {
                window.boxLabelSilent.print(parseInt(shipmentId))
                    .then(success => {
                        if (success) {
                            logStatus('✅ Print successful', 'success');
                        } else {
                            logStatus('⚠️ Print completed with fallback');
                        }
                    })
                    .catch(error => {
                        logStatus('❌ Print failed: ' + error.message, 'error');
                    });
            } else {
                logStatus('❌ boxLabelSilent not available', 'error');
            }
        }

        function checkJSPM() {
            logStatus('Checking JSPrintManager...');

            if (typeof window.boxLabelSilent !== 'undefined') {
                window.boxLabelSilent.checkJSPM()
                    .then(available => {
                        if (available) {
                            logStatus('✅ JSPrintManager available and connected', 'success');
                        } else {
                            logStatus('❌ JSPrintManager not available', 'error');
                        }
                    })
                    .catch(error => {
                        logStatus('❌ JSPrintManager check failed: ' + error.message, 'error');
                    });
            } else {
                logStatus('❌ boxLabelSilent not available', 'error');
            }
        }

        function listPrinters() {
            logStatus('Getting printer list...');

            if (typeof JSPM === 'undefined') {
                logStatus('❌ JSPrintManager not loaded', 'error');
                return;
            }

            JSPM.JSPrintManager.getPrinters()
                .then(printers => {
                    logStatus(`Found ${printers.length} printer(s):`, 'success');
                    printers.forEach(printer => {
                        logStatus('  - ' + printer.name);
                    });
                })
                .catch(error => {
                    logStatus('❌ Failed to get printers: ' + error.message, 'error');
                });
        }
    </script>
</body>
</html>
