<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#fff" stroke-width="4"/>

  <!-- CSS brackets -->
  <g fill="#fff" font-family="monospace" font-size="24" font-weight="bold">
    <!-- Left bracket -->
    <text x="32" y="50">{</text>
    <!-- Right bracket -->
    <text x="88" y="50">}</text>
    <!-- CSS content -->
    <text x="45" y="75" font-size="12">CSS</text>
  </g>

  <!-- Stylized website icon -->
  <g fill="#fff">
    <!-- Monitor/screen -->
    <rect x="45" y="85" width="38" height="25" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="50" y="90" width="28" height="15" rx="1" fill="#fff"/>
    <!-- Stand -->
    <rect x="61" y="110" width="6" height="8" rx="1" fill="#fff"/>
    <rect x="55" y="118" width="18" height="3" rx="1" fill="#fff"/>
  </g>
</svg>